<!-- onmouseover: is an event that occurs when the usermoves the mouse ovet the element -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On MouseOver Element</title>
</head>

<body>

    <h1>On MouseOver</h1>

    <p id="demo" onmouseover="showHello()">
        This is a mouseover effect.
    </p>

    <script>
        function showHello() {
            document.getElementById("demo").innerHTML = "I am grade 9 ";
        }
    </script>

</body>

</html>
