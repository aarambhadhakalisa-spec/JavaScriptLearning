<!-- onload: it is the event which is fired when the page is loaded -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onload Event</title>
</head>

<body>
    <h1>Onload Event</h1>
    <p>The onload event is triggered when the page has finished loading.</p>
    <script>
        window.onload = function () {
            document.body.style.backgroundColor = "pink";
        };
    </script>
</body>

</html>
