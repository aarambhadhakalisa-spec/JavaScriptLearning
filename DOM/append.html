
<!DOCTYPE html>
<html>
<head>
    <title>Array </title>
</head>
<body>

    <h1>JavaScript Array </h1>

    <p id="result1"></p>

    <p id="result2"></p>

    <p id="result3"></p>

    <script>
        let fruits = ["apple", "banana", "orange"];
        fruits.push("mango");
        document.getElementById("result1").innerHTML = fruits;

        let vegetables = ["tomato", "potato", "onion"];
        vegetables.pop();
        document.getElementById("result2").innerHTML = vegetables;

        let colors = ["red", "green", "blue"];
        colors.splice(1, 1, "yellow");
        document.getElementById("result3").innerHTML = colors;
    </script>

</body>
</html>
