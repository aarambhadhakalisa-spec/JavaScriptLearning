<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="student">
  <h1>Student Marks Calculator</h1>
  <p id="result1"></p>
  <p id="result2"></p>
  <p id="result3"></p>
  <p id="result4"></p>
</div>

<script>
  let math = 80;
  let science = 70;

  let addition = math + science;
  let subtraction = math - science;
  let multiplication = math * science;
  let division = math / science;

  document.getElementById("result1").innerHTML = "Addition: " + addition;
  document.getElementById("result2").innerHTML = "Subtraction: " + subtraction;
  document.getElementById("result3").innerHTML = "Multiplication: " + multiplication;
  document.getElementById("result4").innerHTML = "Division: " + division;
</script>
    
</body>
</html>
