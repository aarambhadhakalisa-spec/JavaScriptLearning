<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Even or Odd Checker</title>
</head>
<body>

  <h1 id="result"></h1>

  <script>
    let a = 10;
    
    if (a % 2 === 0) {
      document.getElementById("result").innerHTML = a + " is an even number";
    } else {
      document.getElementById("result").innerHTML = a + " is an odd number";
    }
  </script>

</body>
</html>
