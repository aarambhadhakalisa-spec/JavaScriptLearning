<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop 1 - Continue</title>
</head>
<body>

    <h1>Loop 1 (Using Continue)</h1>

    <script>
        let i = 1;

        while (i <= 10) {
            if (i === 5) {
                i++;
                continue;
            }

            document.write(i + "<br>");
            i++;
        }
    </script>

</body>
</html>
