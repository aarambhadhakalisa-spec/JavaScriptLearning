<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop 2 - Break</title>
</head>
<body>
    <h1>Loop 2 (Using Break)</h1>
    <script>
        let i = 1;
        while (i <= 10) {
            if (i == 5) {
                break;
            }
            document.write(i + "<br>");
            i++;
        }
    </script>
</body>
</html>
