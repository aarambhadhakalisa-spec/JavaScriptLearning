<!DOCTYPE html>
<html>
<head>
    <title>Full Name</title>
</head>
<body>

<script>
function fullname(firstname, middlename, lastname) {
    return firstname + " " + middlename + " " + lastname;
}

let result5 = fullname("Aarambha", "Kumar", "Dhakal");

document.write(result5);
</script>

</body>
</html>
