<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Interval</title>
</head>
<body>
    <h1>Set Interval</h1>

    <p id="output">Processing...</p>

    <script>
        setInterval(function() {
            document.getElementById("output").textContent = "Hello World;"
        } , 2000);
    </script>
</body>
</html>
