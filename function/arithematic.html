<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithematic</title>
</head>
<body>

    <p id="demo"></p>
    <p id="subtraction"></p>
    <p id="Multiplication"></p>
    <p id="Division"></p>

    <script>
        let a = 10;
        let b = 20;
        let c = a + b;
        document.getElementById("demo").innerHTML = "the sum of a and b is " + c;

        let d = 30;
        let e = 10;
        let f = d - e;
        document.getElementById("subtraction").innerHTML = "the difference of d and e is " + f;

        let g = 30;
        let h = 10;
        let i = g * h;
        document.getElementById("Multiplication").innerHTML = "the product of g and h is " + i;

        let j = 30;
        let k = 10;
        let l = j / k;
        document.getElementById("Division").innerHTML = "the division of j and k is " + l;
    </script>
        
</body>
</html>
