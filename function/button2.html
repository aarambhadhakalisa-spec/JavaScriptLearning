<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
</head>
<body>
    <h1>JavaScript Functions</h1>

    <p>You can call functions from events.</p>

    <button onclick="showSubmit()">Submit</button>


    <p id="demo2"></p>


    <script>
        function submitform() {
            return "Form Submitted";
        }

        function showSubmit() {
            document.getElementById("demo2").innerHTML = submitform();
        }


    </script>
</body>

</html>
