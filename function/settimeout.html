<!DOCTYPE html>
<html>
<head>
    <title>setTimeout Example</title>
</head>
<body>

    <h1>setTimeout Example</h1>
    <p id="output">Processing</p>

    <script>
        setTimeout(function() {
            document.getElementById("output").textContent = "Hello World";
        }, 5000);
    </script>

</body>
</html>
